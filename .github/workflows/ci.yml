name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: mise run test

  # The test database for manual testing (docs/testing.md) is built from
  # tests/manual/database.xml; this catches a broken definition or task.
  manual-database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fish keepassxc
      - run: mise run database:import
      - run: echo password | keepassxc-cli ls --quiet tests/manual/database.kdbx | grep -x Multi-Field
