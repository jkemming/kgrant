name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the `v` (e.g. 0.2.0)
        required: true

permissions:
  contents: write

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must look like 1.2.3, got: $VERSION" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "tag v$VERSION already exists" >&2
            exit 1
          fi
      - name: Set the version and commit it to main
        id: commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i '0,/^version = ".*"/s//version = "'"$VERSION"'"/' Cargo.toml
          cargo update --workspace
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: release v$VERSION"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-26-intel }
          - { target: aarch64-apple-darwin, os: macos-26 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: jdx/mise-action@v5
      - run: mise run build --target ${{ matrix.target }}
      - name: Name the binary
        run: mv "target/${{ matrix.target }}/release/kgrant" "kgrant-v${{ inputs.version }}-${{ matrix.target }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: kgrant-*

  release:
    needs: [prepare, build]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "v$VERSION" \
            --generate-notes
