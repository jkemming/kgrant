[package]
name = "kgrant"
edition = "2024"
license = "EUPL-1.2"
publish = false
version = "0.2.0"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
crypto_box = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
